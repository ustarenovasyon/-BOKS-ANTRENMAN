name: PART32 Probe

on:
  push:
    branches:
      - part32-durable-regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe canonical 6M/104 candidate
        run: |
          cat > .part32-probe.mjs <<'EOF'
          import { createServer } from 'vite';
          const server = await createServer({ server: { middlewareMode: true }, appType: 'custom' });
          try {
            const { generateProgramBlueprint } = await server.ssrLoadModule('/src/features/programGeneration/programGenerationEngine.js');
            const { auditProgramSnapshot } = await server.ssrLoadModule('/src/features/programAudit/programAuditEngine.js');
            const input = {
              programMode: 'boxing_only',
              durationMonths: 6,
              daysPerWeek: 4,
              selectedWeekdays: ['MONDAY','WEDNESDAY','FRIDAY','SUNDAY'],
              sessionDurationMinutes: 30,
              experienceLevel: 'beginner',
              difficulty: 'normal',
              preferredTrainingTime: null,
              boxingStance: 'orthodox',
              boxingMaxMoves: 4,
              strengthDaysPerWeek: 0,
              availableEquipment: [],
              generationLocalDate: '2026-01-02',
              generationSeed: 'part32-canonical-6m104-seed-v1',
              generationRequestId: 'part32-canonical-6m104-request-v1'
            };
            const first = generateProgramBlueprint(input);
            const second = generateProgramBlueprint(input);
            console.log(`valid=${first.valid} reasons=${JSON.stringify(first.reasons)}`);
            if (first.valid) {
              const audit = auditProgramSnapshot(first.blueprint);
              console.log(JSON.stringify({
                days: first.blueprint.programDays.length,
                start: first.blueprint.programVersion.programStartDate,
                end: first.blueprint.programVersion.endDateExclusive,
                fp: first.blueprint.blueprintFingerprint,
                auditOutcome: audit.outcome,
                afp: audit.auditFingerprint,
                critical: audit.criticalIssueCount,
                warnings: audit.warningCount,
                deepEqual: JSON.stringify(first.blueprint) === JSON.stringify(second.blueprint)
              }));
            }
          } finally {
            await server.close();
          }
          EOF
          node .part32-probe.mjs
          rm .part32-probe.mjs
