name: Repair and verify independent BOX ANTRENMAN

on:
  push:
    paths:
      - '.github/workflows/install-independent.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add missing Tailwind animation dependency
        run: npm install --save-dev --save-exact tailwindcss-animate@1.0.7

      - name: Verify independence
        run: npm run verify:independent

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit dependency repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "fix: add missing tailwindcss-animate build dependency"
            git push origin HEAD:main
          fi
