import {
  BOXING_FOOTWORK_INTEGRATION_PHASES,
  GENERATION_POLICY_VERSIONS,
  WORKOUT_BLOCK_TYPES,
} from '@/config/architecture';
import {
  getEligibleFootworkMoveIdsAtStage,
