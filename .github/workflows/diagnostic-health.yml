name: Diagnostic Health Matrix

on:
  push:
    branches:
      - diagnostic-full-health

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compact post-fix summary
        run: node tests/diagnostic-summary.mjs
