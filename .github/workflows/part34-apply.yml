name: PART34 Apply Patch

on:
  push:
    branches:
      - part34-footwork-isolated-drill
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: part34-footwork-isolated-drill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply PART 34 patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/part34.patch
          git apply --check /tmp/part34.patch
          git apply /tmp/part34.patch
          rm .github/workflows/part34-apply.yml
      - run: npm ci
      - run: npm run verify:independent
      - run: npm run test:regression
      - run: npm run lint
      - run: npm run build
      - name: Commit PART 34
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PART 34: add dormant footwork isolated drill support"
          git push origin HEAD:part34-footwork-isolated-drill
